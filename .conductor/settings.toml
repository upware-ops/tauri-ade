"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = """
npm ci
cargo fetch --locked --manifest-path src-tauri/Cargo.toml
"""
# Conductor owns the worktree and stops its run process; setup creates no external resources.
archive = "true"
run_mode = "concurrent"

[scripts.run.app]
available_in = [ "local" ]
command = '''
source ~/.cargo/env
npm run tauri -- dev --config "{\"identifier\":\"com.upware-ops.tauri-ade.$CONDUCTOR_WORKSPACE_ID\",\"build\":{\"beforeDevCommand\":\"npm run dev -- --port $CONDUCTOR_PORT\",\"devUrl\":\"http://localhost:$CONDUCTOR_PORT\"}}"
'''
default = true
icon = "play"
