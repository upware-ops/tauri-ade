name: 'Prepare release'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: 'prepare-release'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 'Prepare release'
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = 'refs/heads/main'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Require dispatched commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Update and validate release metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: npm run release:prepare -- "$BUMP"

  tag:
    name: 'Commit and tag'
    needs: prepare
    permissions:
      contents: write
    runs-on: 'ubuntu-22.04'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Require dispatched commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Update release metadata
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/prepare-release.js "$BUMP" --skip-checks

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node --print "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): $TAG"
          git tag --annotate "$TAG" --message "Tauri ADE $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG:refs/tags/$TAG"

  dispatch:
    name: 'Dispatch release'
    needs: tag
    permissions:
      actions: write
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run:
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main --field
          tag="$TAG"
