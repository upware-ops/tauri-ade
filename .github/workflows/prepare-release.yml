name: 'Prepare release'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semantic version increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: 'prepare-release'
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: 'Prepare release'
    runs-on: 'ubuntu-22.04'
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = 'refs/heads/main'

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Update and validate release metadata
        run: npm run release:prepare -- '${{ inputs.bump }}'

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node --print "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): $TAG"
          git tag --annotate "$TAG" --message "Tauri ADE $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG:refs/tags/$TAG"

  dispatch:
    name: 'Dispatch release'
    needs: prepare
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main --field tag="$TAG"
